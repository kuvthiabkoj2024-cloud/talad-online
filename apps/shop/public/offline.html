<!doctype html>
<html lang="lo">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2e7d32" />
    <title>Offline · Taladonline Seller Center</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f3f4f6; --card: #fff; --fg: #1f2937; --muted: #6b7280; --primary: #2e7d32; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1411; --card: #18201b; --fg: #e5e7eb; --muted: #9ca3af; --primary: #4caf50; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Lao", "Phetsarath OT", sans-serif; }
      main { width: 100%; max-width: 380px; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.08); }
      img { width: 72px; height: 72px; }
      h1 { margin: 18px 0 6px; font-size: 1.35rem; }
      p { margin: 0; color: var(--muted); line-height: 1.55; font-size: 0.95rem; }
      .en { margin-top: 14px; font-size: 0.85rem; }
      button { margin-top: 24px; width: 100%; height: 48px; border: 0; border-radius: 999px; background: var(--primary); color: #fff;
        font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>ບໍ່ມີອິນເຕີເນັດ</h1>
      <p>ກະລຸນາກວດເບິ່ງການເຊື່ອມຕໍ່ ແລ້ວລອງໃໝ່ອີກຄັ້ງ.</p>
      <p class="en">You’re offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">ລອງໃໝ່ · Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
