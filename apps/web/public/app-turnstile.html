<!doctype html>
<!--
  The mobile app's robot check (Cloudflare Turnstile). The app shows this page in a web view:
  Turnstile only runs on pages of an allowed hostname, so it lives on the storefront.
  Query: k = site key, a = action, l = language (lo|en), t = theme (light|dark).
  Results go to the app with postMessage: { token } / { token: null } / { error }.
  The app asks for a fresh token by loading the page again (resetTurnstile() also works).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
    <meta name="robots" content="noindex" />
    <title>MC Mart</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
    </style>
    <script>
      var q = new URLSearchParams(location.search);
      var widget;
      function post(m) {
        if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(m));
      }
      function start() {
        widget = turnstile.render('#box', {
          sitekey: q.get('k') || '',
          action: q.get('a') || 'app',
          language: q.get('l') === 'en' ? 'en' : 'lo',
          theme: q.get('t') === 'dark' ? 'dark' : 'light',
          size: 'flexible',
          callback: function (t) {
            post({ token: t });
          },
          'expired-callback': function () {
            post({ token: null });
          },
          'error-callback': function (c) {
            post({ error: String(c) });
            return true;
          },
          'unsupported-callback': function () {
            post({ error: 'unsupported' });
          },
        });
      }
      function resetTurnstile() {
        if (widget !== undefined) turnstile.reset(widget);
      }
    </script>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
      onload="start()"
      onerror="post({ error: 'script' })"
    ></script>
  </head>
  <body>
    <div id="box"></div>
  </body>
</html>
