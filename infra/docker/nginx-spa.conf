# Serves a built single-page app (Seller Center / admin) inside its container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build files never change: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must always be fresh so new releases load right away.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routes (e.g. /orders/TL123) fall back to the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
