#############################################
# Taladonline — nginx on the host (TLS) → Docker containers on 127.0.0.1
#   taladonline.la, www  → 127.0.0.1:3010  (storefront, talad-prod-web)
#   api.taladonline.la   → 127.0.0.1:4000  (API, talad-prod-api)
#   shop.taladonline.la  → 127.0.0.1:8110  (Seller Center, talad-prod-shop)
#   admin.taladonline.la → 127.0.0.1:8120  (admin console, talad-prod-admin)
# Certificate: one Let's Encrypt certificate for all five names, in
#   /etc/letsencrypt/live/taladonline.la/
#############################################

# WebSocket upgrade when asked for, plain keep-alive otherwise (server-sent events need that).
map $http_upgrade $talad_connection_upgrade {
    default upgrade;
    ''      '';
}

#############################################
# HTTP → HTTPS (all Taladonline domains)
#############################################

server {
    listen 80;
    server_name taladonline.la www.taladonline.la api.taladonline.la shop.taladonline.la admin.taladonline.la;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

#############################################
# taladonline.la (Customer storefront)
#############################################

server {
    server_name taladonline.la www.taladonline.la;

    # Payment slips, photo search, avatars
    client_max_body_size 20M;

    # Customers' feed videos (up to ~200 MB), streamed through to the API
    location /api/feed-posts {
        client_max_body_size 250M;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Live updates (orders, chat): server-sent events, must not be buffered
    location /api/events {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $talad_connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/taladonline.la/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taladonline.la/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

#############################################
# api.taladonline.la (Backend API)
#############################################

server {
    server_name api.taladonline.la;

    # Product videos (up to ~200 MB) upload through the API
    client_max_body_size 250M;
    # Stream uploads straight to the API instead of spooling them to disk first
    proxy_request_buffering off;

    # Live updates for the storefront, Seller Center and admin (/me/events, /me/shop/events, /admin/events)
    location ~ /events$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $talad_connection_upgrade;

        # Large uploads on slow mobile connections can take a long time
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/taladonline.la/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taladonline.la/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

#############################################
# shop.taladonline.la (Seller Center)
#############################################

server {
    server_name shop.taladonline.la;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/taladonline.la/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taladonline.la/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

#############################################
# admin.taladonline.la (Admin console)
#############################################

server {
    server_name admin.taladonline.la;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/taladonline.la/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taladonline.la/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
