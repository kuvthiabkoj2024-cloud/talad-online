packages:
  - apps/*
  - services/*
  - packages/*

# Dependencies permitted to run install scripts (pnpm blocks them by default)
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  argon2: true
  esbuild: true
  # Image search (CLIP via @huggingface/transformers): native ONNX runtime
  onnxruntime-node: true
  prisma: true
  # Only prints a version notice
  protobufjs: false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - '@expo/ui@57.0.20'
  - babel-preset-expo@57.0.13
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo-router@57.0.23
  - expo@57.0.25

# Next's own type declarations import React's types, which it doesn't declare. Without this, pnpm
# resolves them to whichever @types/react it happens to hoist (the mobile app's older one) and
# the storefront's typecheck fails on mismatched React types.
packageExtensions:
  next:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
